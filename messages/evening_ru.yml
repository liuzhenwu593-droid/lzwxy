# Russian evening / good night greeting messages
# Each line is one message template.
# Supported placeholders: {name}, {date}, {weekday}, {time}, {day}, {month}, {year}
# One message is randomly selected each evening.

messages:
  - "Спокойной ночи, {name}! Пусть сны будут приятными, а утро — добрым. Высыпайся!"
  - "Добрых снов, {name}! Отдыхай и набирайся сил перед новым днём. Ты этого заслуживаешь."
  - "Спокойной ночи! Желаю, {name}, видеть только красивые и светлые сны."
  - "Доброй ночи, {name}! Пусть этот день закончится на приятной ноте, а завтра будет ещё лучше."
  - "Спокойной ночи, {name}! Высыпайся как следует, завтра будет новый интересный день."
  - "Добрых снов! Пусть ночь, {name}, принесёт покой и восстановление сил. Засыпай с мыслью о хорошем."
  - "Спокойной ночи, {name}! Желаю глубокого и крепкого сна. Завтра встанешь отдохнувшим."
  - "Доброй ночи! Пусть все заботы останутся сегодня, {name}, а завтра будет легче. Спокойной ночи!"
  - "Спокойной ночи, {name}! Надеюсь, твой день был хорошим. Желаю приятных сновидений."
  - "Добрых снов, {name}! Отдыхай хорошо — ты много сделал сегодня. Горжусь тобой."
  - "Спокойной ночи! Пусть луна светит тихо, {name}, а сон будет глубоким и спокойным."
  - "Доброй ночи, {name}! Закрывай глаза и представляй что-то приятное. Желаю сладких снов."
  - "Спокойной ночи, {name}! Сегодня был долгий день, пора отдохнуть. Добрых снов!"
  - "Добрых снов! Желаю, {name}, чтобы утром ты проснулся с улыбкой и новыми силами."
  - "Спокойной ночи, {name}! Пусть эта ночь будет тёплой и спокойной. Высыпайся!"
